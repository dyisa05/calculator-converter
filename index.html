<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator & Metric Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Left navigation menu -->
    <nav class="sidebar">
      <button id="calc-btn" class="nav-btn active">Calculator</button>
      <button id="conv-btn" class="nav-btn">Converter</button>
    </nav>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Calculator Section -->
      <section id="calculator-section" class="page-section active">
        <div class="calculator">
          <div id="calc-display" class="calc-display">0</div>
          <div class="calc-buttons">
            <button class="btn" data-value="C">C</button>
            <button class="btn" data-value="%">%</button>
            <button class="btn" data-value="/">÷</button>
            <button class="btn" data-value="*">×</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn" data-value="-">−</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn" data-value="+">+</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn" data-value="=">=</button>

            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
          </div>
        </div>
      </section>

      <!-- Converter Section -->
      <section id="converter-section" class="page-section">
        <div class="converter-box">
          <h2>Metric Converter</h2>
          <div class="converter-row">
            <label for="input-value">Input Value:</label>
            <input type="number" id="input-value" placeholder="Enter value">
          </div>
          <div class="converter-row">
  <label for="category">Category:</label>
  <select id="category">
    <option value="length">Length</option>
    <option value="weight">Weight</option>
    <option value="volume">Volume</option>
    <option value="temperature">Temperature</option>
    <option value="time">Time</option>
    <option value="area">Area</option>
    <option value="speed">Speed</option>
  </select>
</div>
          <div class="converter-row">
            <label for="from-unit">From:</label>
            <select id="from-unit"></select>
          </div>
          <div class="converter-row">
            <label for="to-unit">To:</label>
            <select id="to-unit"></select>
          </div>
          <div class="converter-result">
            <span id="converted-value">Result will appear here</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
